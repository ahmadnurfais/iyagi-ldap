data_dir = "/var/lib/vector"

[api]
enabled = false

# Structured audit events emitted to stdout by the audit-interceptor container
[sources.audit_interceptor]
type = "docker_logs"
include_containers = ["iyagi-audit-interceptor"]

# Raw HTTP access log written by Caddy
[sources.caddy_access]
type = "file"
include = ["/var/log/caddy/access.log"]
read_from = "beginning"
ignore_older_secs = 604800

[transforms.parse_audit]
type = "remap"
inputs = ["audit_interceptor"]
source = '''
parsed, err = parse_json(.message)
if err == null && is_object(parsed) {
  . = merge!(., parsed)
  del(.message)
}
.service = "lldap-audit"
if exists(.actor.ip) { .actor_ip = .actor.ip }
if exists(.actor.user_id) { .actor_user_id = .actor.user_id }
if !exists(.event_type) { .event_type = "audit.unknown" }
'''

[transforms.enrich_caddy]
type = "remap"
inputs = ["caddy_access"]
source = '''
parsed, err = parse_json(.message)
if err == null && is_object(parsed) {
  . = merge!(., parsed)
  del(.message)
}
.service = "lldap-audit-http"
'''

[sinks.loki_audit]
type = "loki"
inputs = ["parse_audit"]
endpoint = "http://loki:3100"
encoding.codec = "json"
labels.service = "lldap-audit"
labels.event_type = "{{ event_type }}"
labels.host = "iyagi-lldap"
out_of_order_action = "accept"
remove_label_fields = true
compression = "snappy"

[sinks.loki_http]
type = "loki"
inputs = ["enrich_caddy"]
endpoint = "http://loki:3100"
encoding.codec = "json"
labels.service = "lldap-audit-http"
labels.host = "iyagi-lldap"
out_of_order_action = "accept"
compression = "snappy"

[sinks.loki_audit.buffer]
type = "disk"
max_size = 268435488
when_full = "block"

[sinks.loki_http.buffer]
type = "disk"
max_size = 268435488
when_full = "block"
