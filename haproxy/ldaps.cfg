global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend ldaps
    bind :6360
    default_backend lldap_ldaps

backend lldap_ldaps
    server lldap lldap-core:6360 check check-ssl verify none init-addr libc,last,none
